<!-- RECIPES/templates/category_detail.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать категорию — {{ category.name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .back-link {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container">
        <a href="{{ url_for('objects.category_page', category_id=category.id) }}" class="btn btn-secondary back-link">
            ← Вернуться к категории
        </a>

        <div class="form-container">
            <h2 class="text-center mb-4">Редактировать категорию: <strong>{{ category.name }}</strong></h2>

            <form method="POST" action="{{ url_for('edit_objects.edit_category', category_id=category.id) }}">
                <div class="mb-3">
                    <label for="category_name" class="form-label">Название категории</label>
                    <input type="text" class="form-control" id="category_name" name="category_name" 
                           value="{{ category.name }}" required autofocus>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-warning">Сохранить изменения</button>
                    <a href="{{ url_for('objects.category_page', category_id=category.id) }}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
