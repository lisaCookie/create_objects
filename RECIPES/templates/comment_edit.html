<!-- comment_edit.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование комментария</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit.css') }}">
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container">
        <!-- Кнопка возврата (стиль как в category_detail) -->
        <a href="{{ url_for('index') }}" class="btn btn-secondary back-link">
            ← Вернуться на главную
        </a>

        <div class="form-container">
            <h2 class="text-center mb-4">Редактировать комментарий</h2>

            <form method="POST">
                <div class="mb-3">
                    <label for="comment_text" class="form-label">Текст комментария</label>
                    <textarea
                        class="form-control"
                        id="comment_text"
                        name="comment_text"
                        rows="5"
                        required
                    >{{ session.editing_comment.text }}</textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-warning">Сохранить изменения</button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
