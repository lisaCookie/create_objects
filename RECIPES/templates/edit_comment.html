<!-- RECIPES/templates/edit_comment.html -->
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать комментарий</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/startpage.css') }}">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="nav-bar">
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('my_contribution.my_contribution') }}">📝 Мой вклад</a>
        <a href="{{ url_for('login.logout') }}">Выход</a>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="flash">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="container">
        <h2>✏️ Редактировать комментарий</h2>
        <form method="POST" action="{{ url_for('edit_objects.edit_comment', comment_id=comment.id) }}">
            <label>Текст:</label><br>
            <textarea name="comment_text" rows="4" required>{{ comment.text }}</textarea><br><br>

            <button type="submit">Сохранить</button>
            <a href="{{ url_for('objects.category_page', category_id=comment.category_id) }}">Отмена</a>
        </form>
    </div>
</body>
</html>
