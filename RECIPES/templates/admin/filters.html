<!-- filter.html -->
<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <label for="filter_creator" class="form-label">Фильтр по создателю:</label>
        <select id="filter_creator" name="creator_id" class="form-select">
          <option value="">Все создатели</option>
          {% for user in all_users_for_filter %}
            <option value="{{ user.id }}" {% if current_creator_id == user.id|string %}selected{% endif %}>{{ user.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="filter_category" class="form-label">Фильтр по категории:</label>
        <select id="filter_category" name="category_id" class="form-select">
          <option value="">Все категории</option>
          {% for cat in all_categories_for_filter %}
            <option value="{{ cat.id }}" {% if current_category_id == cat.id|string %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="filter_object" class="form-label">Фильтр по объекту (для комментариев):</label>
        <select id="filter_object" name="object_id" class="form-select">
          <option value="">Все объекты</option>
          {% for obj in all_objects_for_filter %}
            <option value="{{ obj.id }}" {% if current_object_id == obj.id|string %}selected{% endif %}>{{ obj.name }} ({{ obj.category_name }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="mt-3 text-end">
      <button id="clear_filters" class="btn btn-outline-secondary">Очистить фильтры</button>
    </div>
  </div>
</div>
